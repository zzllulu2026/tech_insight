<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技术洞察 · Tech Insight</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1a1d21; --muted:#6b7280; --border:#e5e7eb;
    --accent:#2563eb; --accent-soft:#eff6ff; --tag-ai:#dbeafe; --tag-infra:#d1fae5; --tag-hw:#fef3c7; --tag-other:#f3f4f6;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0f1115; --card:#171a20; --text:#e5e7eb; --muted:#9ca3af; --border:#2a2e36;
    --accent:#60a5fa; --accent-soft:#1e293b; --tag-ai:#1e3a5f; --tag-infra:#134e4a; --tag-hw:#78350f; --tag-other:#26292f;
  }}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--border);padding:14px 20px}
  .hwrap{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  h1{font-size:18px;font-weight:600;margin-right:auto}
  h1 span{color:var(--muted);font-weight:400;font-size:13px;margin-left:8px}
  input[type=search]{flex:1;min-width:180px;padding:7px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
  .tags{display:flex;gap:8px;flex-wrap:wrap}
  .tagbtn{padding:4px 12px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;cursor:pointer}
  .tagbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  main{max-width:960px;margin:20px auto;padding:0 16px 60px}
  .datehead{margin:26px 0 12px;font-size:15px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:12px}
  .datehead::after{content:"";flex:1;height:1px;background:var(--border)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .card .t{font-size:14px;font-weight:600}
  .card .t a{color:var(--text);text-decoration:none}
  .card .t a:hover{color:var(--accent)}
  .card .s{font-size:13px;color:var(--muted);margin:6px 0 8px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11px;color:var(--muted)}
  .pill{padding:2px 9px;border-radius:999px;font-size:11px}
  .src{background:var(--accent-soft);color:var(--accent)}
  .cat-ai{background:var(--tag-ai)}
  .cat-infra{background:var(--tag-infra)}
  .cat-hw{background:var(--tag-hw)}
  .cat-other{background:var(--tag-other)}
  .score{margin-left:auto}
  .review{margin-top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .rsel{padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
  .rbtn{padding:3px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted);font-size:12px;cursor:pointer}
  .rbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .rnote{flex:1;min-width:140px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
  .mark{font-size:11px;color:var(--accent)}
  .toolbar{max-width:960px;margin:0 auto;padding:0 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end}
  #tokenInput{max-width:220px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px}
  #syncStat{font-size:11px;color:var(--muted);margin-right:auto}
  #exportBtn{padding:6px 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-size:12px;cursor:pointer}
  #exportBtn:disabled{opacity:.4;cursor:default}
  .empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
  .catcards{max-width:960px;margin:14px auto 0;padding:0 16px;display:flex;gap:12px}
  .catcard{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;cursor:pointer}
  .catcard.on{border-color:var(--accent);background:var(--accent-soft)}
  .catcard .n{font-size:22px;font-weight:600;color:var(--text)}
  .catcard .l{font-size:12px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1>技术洞察 <span>Tech Insight Daily</span></h1>
    <input type="search" id="q" placeholder="搜索标题 / 摘要 / 标签…">
  </div>
  <div class="hwrap" style="margin-top:10px">
    <div class="tags" id="tagbar"></div>
  </div>
</header>
<div class="toolbar" style="margin-top:14px">
  <span id="syncStat"></span>
  <input type="password" id="tokenInput" placeholder="GitHub PAT（评价写回用）" onchange="saveToken(this.value)">
  <button id="syncBtn" onclick="pushReviews(true)">同步到 GitHub</button>
  <button id="exportBtn" onclick="exportReviews()" disabled>导出评价 (0)</button>
</div>
<div class="catcards" id="catcards"></div>
<main id="list"><div class="empty">正在加载 manifest.json …</div></main>

<script>
const CAT_CLS = {"AI/大模型":"cat-ai","后端/基础设施":"cat-infra","硬件/芯片":"cat-hw"};
let ALL = [], MANIFEST = null, ACTIVE_TAGS = new Set(), QUERY = "";
let CAT_FILTER = "待人工审核";
const REVIEWS = JSON.parse(localStorage.getItem("ti_reviews") || "{}");

function stateOf(it){
  return (REVIEWS[it.id]||{}).state === "已人工审核" ? "已人工审核" : "待人工审核";
}

// ---------- GitHub sync (Contents API, reviews/reviews.json) ----------
const REPO = "zzllulu2026/tech_insight";
let TOKEN = localStorage.getItem("ti_token") || "";
const SYNC = { sha: null };
let syncTimer = null;

function setSync(t){ document.getElementById("syncStat").textContent = t; }
function saveToken(v){
  TOKEN = v.trim();
  localStorage.setItem("ti_token", TOKEN);
  if (TOKEN) pullReviews(); else setSync("");
}
function b64ToUtf8(b64){
  const bin = atob(b64.replace(/\s/g,""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function utf8ToB64(s){
  const bytes = new TextEncoder().encode(s);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
async function ghFetch(path, opts={}){
  const r = await fetch(`https://api.github.com/repos/${REPO}${path}`, {
    ...opts,
    headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${TOKEN}`, ...(opts.headers||{}) }
  });
  return r;
}
async function pullReviews(){
  if (!TOKEN) return;
  setSync("拉取云端评价…");
  try {
    const r = await ghFetch("/contents/reviews/reviews.json");
    if (r.status === 200) {
      const d = await r.json(); SYNC.sha = d.sha;
      const remote = JSON.parse(b64ToUtf8(d.content));
      let changed = false;
      for (const rv of remote) {
        const cur = REVIEWS[rv.lead_id];
        if (!cur || new Date(rv.reviewed_at||0) > new Date(cur.reviewed_at||0)) { REVIEWS[rv.lead_id] = rv; changed = true; }
      }
      if (changed) {
        localStorage.setItem("ti_reviews", JSON.stringify(REVIEWS));
        refreshExportBtn(); renderCatcards(); render();
      }
      setSync(`✔ 云端 ${remote.length} 条已合并`);
    } else if (r.status === 404) { SYNC.sha = null; setSync("云端暂无评价文件，首次同步将创建"); }
    else throw new Error("HTTP " + r.status);
  } catch (e) { setSync("✕ 拉取失败: " + e.message); }
}
async function pushReviews(manual){
  if (!TOKEN) { if (manual) setSync("请先在右侧填入 GitHub PAT"); return; }
  setSync("同步中…");
  try {
    const body = { message: "chore: sync review data", content: utf8ToB64(JSON.stringify(Object.values(REVIEWS), null, 2)) };
    if (SYNC.sha) body.sha = SYNC.sha;
    const r = await ghFetch("/contents/reviews/reviews.json", { method: "PUT", body: JSON.stringify(body) });
    if (r.ok) {
      const d = await r.json(); SYNC.sha = d.content.sha;
      setSync(`✔ 已同步 ${Object.keys(REVIEWS).length} 条 · ${new Date().toLocaleTimeString()}`);
    } else {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.message || ("HTTP " + r.status));
    }
  } catch (e) { setSync("✕ 同步失败: " + e.message); }
}
function scheduleSync(){
  if (!TOKEN) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => pushReviews(false), 2500);
}

function refreshExportBtn(){
  const n = Object.keys(REVIEWS).length;
  const b = document.getElementById("exportBtn");
  b.textContent = `导出评价 (${n})`;
  b.disabled = n === 0;
}

function reviewUI(it){
  const r = REVIEWS[it.id] || {};
  const state = r.state || "待人工审核";
  const val = r.valuable || "待确认";
  const opt = (cur,v) => `<option ${cur===v?"selected":""}>${v}</option>`;
  return `<div class="review">
    <select class="rsel" onchange="updReview('${it.id}','state',this.value)" title="审核状态">
      ${opt(state,"待人工审核")}${opt(state,"已人工审核")}
    </select>
    <select class="rsel" onchange="updReview('${it.id}','valuable',this.value)" title="是否对云核有价值">
      ${opt(val,"待确认")}${opt(val,"是")}${opt(val,"否")}
    </select>
    <input class="rnote" placeholder="评价（文字输入）" value="${esc(r.note||"")}"
      onchange="updReview('${it.id}','note',this.value)">
    ${state==="已人工审核"?`<span class="mark">✔ 已审</span>`:""}
  </div>`;
}

function card(it){
  const cats = (it.tags||["其他"]).map(c=>{
    const cls = CAT_CLS[c]||"cat-other";
    return `<span class="pill ${cls}" onclick="toggleTag('${c}')" style="cursor:pointer">${c}</span>`;
  }).join("");
  const rv = REVIEWS[it.id];
  return `<div class="card ${rv?'rv':''}">
    <div class="t"><a href="${it.source}" target="_blank" rel="noopener">${esc(it.title)}</a> ${rv&&rv.valuable==="是"?'<span class="pill src">云核价值 ✓</span>':""}</div>
    <div class="s">${esc(it.summary||"")}</div>
    <div class="meta">
      <span class="pill src">${esc(it.origin)}</span>${cats}
      <span>${(it.date||"").slice(0,10)}</span>
      <span class="score">★ ${it.score??""}</span>
    </div>
    ${reviewUI(it)}
  </div>`;
}

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function render(){
  const list = document.getElementById("list");
  let items = ALL;
  if (CAT_FILTER) items = items.filter(i => stateOf(i) === CAT_FILTER);
  if (ACTIVE_TAGS.size) items = items.filter(i => (i.tags||[]).some(t=>ACTIVE_TAGS.has(t)));
  if (QUERY) {
    const q = QUERY.toLowerCase();
    items = items.filter(i => (i.title+i.summary+(i.tags||[]).join()).toLowerCase().includes(q));
  }
  if (!items.length){ list.innerHTML = `<div class="empty">没有匹配的线索</div>`; return; }
  list.innerHTML = items.map(card).join("");
}

function setCat(c){
  CAT_FILTER = (CAT_FILTER === c) ? "" : c;
  renderCatcards(); render();
}
function renderCatcards(){
  const pend = ALL.filter(i => stateOf(i) === "待人工审核").length;
  const done = ALL.length - pend;
  document.getElementById("catcards").innerHTML = `
    <div class="catcard ${CAT_FILTER==="待人工审核"?"on":""}" onclick="setCat('待人工审核')">
      <div class="n">${pend}</div><div class="l">待人工审核</div>
    </div>
    <div class="catcard ${CAT_FILTER==="已人工审核"?"on":""}" onclick="setCat('已人工审核')">
      <div class="n">${done}</div><div class="l">已人工审核</div>
    </div>`;
}

function updReview(id, field, value){
  if (!REVIEWS[id]) REVIEWS[id] = { lead_id:id, state:"待人工审核", valuable:"待确认", note:"" };
  REVIEWS[id][field] = value;
  REVIEWS[id].reviewed_at = new Date().toISOString();
  localStorage.setItem("ti_reviews", JSON.stringify(REVIEWS));
  refreshExportBtn(); renderCatcards(); render();
  scheduleSync();
}
function exportReviews(){
  const clean = Object.values(REVIEWS);
  const blob = new Blob([JSON.stringify(clean,null,2)],{type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `reviews-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function toggleTag(t){
  ACTIVE_TAGS.has(t) ? ACTIVE_TAGS.delete(t) : ACTIVE_TAGS.add(t);
  renderTagbar(); render();
}
function renderTagbar(){
  const counts = {};
  for (const it of ALL) for (const t of (it.tags||[])) counts[t]=(counts[t]||0)+1;
  document.getElementById("tagbar").innerHTML = Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .map(([t,c])=>`<button class="tagbtn ${ACTIVE_TAGS.has(t)?'on':''}" onclick="toggleTag('${t}')">${t} ${c}</button>`).join("");
}
document.getElementById("q").addEventListener("input", e=>{ QUERY=e.target.value.trim(); render(); });

(async function init(){
  try{
    MANIFEST = await (await fetch("leads/manifest.json")).json();
    ALL = MANIFEST.leads || [];
  }catch(e){
    document.getElementById("list").innerHTML =
      `<div class="empty">未找到 leads/manifest.json —— 请先运行数据生成步骤，或通过本地 HTTP 服务打开本页（如 <code>npx serve</code>）</div>`;
    return;
  }
  refreshExportBtn(); renderTagbar(); renderCatcards(); render();
  if (TOKEN) { document.getElementById("tokenInput").value = TOKEN; pullReviews(); }
})();
</script>
</body>
</html>
